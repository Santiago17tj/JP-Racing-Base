# Red de seguridad entre el portátil y el taller del cliente.
#
# Este proyecto llegó a tener doce bugs de pérdida de datos en producción
# porque no había nada entre "compilo" y "el mecánico lo usa". Las 147 pruebas
# solo servían si alguien se acordaba de correrlas. Ahora corren solas.
#
# Lo que vigila, en orden de lo que más caro sale:
#   1. Que compile sin errores.
#   2. Que las pruebas pasen — incluidas las guardas de esquema y de cálculo
#      de dinero, que son las que evitan que un dato se pierda en silencio.
#   3. Que la versión suba en los tres archivos a la vez. Van sincronizados y
#      es fácil olvidarse de uno; si Android no ve un versionCode nuevo, la
#      actualización no entra.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    name: Análisis y pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      # Sin `--no-fatal-infos`: el proyecto está en cero avisos y se queda así.
      # Cualquier deprecación nueva o lint que aparezca pone el CI en rojo el
      # mismo día, en vez de acumularse hasta que nadie los mira.
      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: La versión sube en los tres archivos a la vez
        run: |
          set -e
          GRADLE_CODE=$(grep -oP 'versionCode = \K\d+' android/app/build.gradle.kts)
          GRADLE_NAME=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          PUBSPEC=$(grep -oP '^version: \K.+' pubspec.yaml)
          CONFIG=$(grep -oP "appVersion = '\K[^']+" lib/core/config/app_config.dart)

          echo "build.gradle.kts : $GRADLE_NAME+$GRADLE_CODE"
          echo "pubspec.yaml     : $PUBSPEC"
          echo "app_config.dart  : $CONFIG"

          if [ "$PUBSPEC" != "$GRADLE_NAME+$GRADLE_CODE" ]; then
            echo "::error::pubspec.yaml y build.gradle.kts no coinciden."
            exit 1
          fi
          if [ "$CONFIG" != "$GRADLE_NAME" ]; then
            echo "::error::AppConfig.appVersion no coincide con versionName."
            exit 1
          fi
          echo "Versiones coherentes."

  compilar:
    name: Compila el APK
    runs-on: ubuntu-latest
    needs: verificar

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - run: flutter pub get

      # Sin firmar a propósito: el keystore no está en el repositorio y no debe
      # estarlo. Esto solo comprueba que el APK se genera; la versión que se le
      # entrega al cliente se compila y se firma en local, verificando la huella
      # con `apksigner` (ver CLAUDE.md).
      - name: APK de depuración (solo verifica que compila)
        run: flutter build apk --debug
